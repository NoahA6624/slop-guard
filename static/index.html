<!doctype html>

    <meta name="theme-color" content="#fafbf9" />
    <meta
      name="description"
      content="Evidence-first code review for AI-assisted projects. Find the problem. Inspect the proof. Leave with a fix."

    <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />

    <a class="skip" href="#main">Skip to content</a>
    <header>
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Slop Guard home"
          ><svg viewBox="0 0 28 32" aria-hidden="true">
            <path d="M14 2 26 7v10c0 6-7 11-12 13C9 28 2 23 2 17V7Z" />
            <path d="m8 16 4 4 8-9" /></svg
          ><span
            >slop<span class="brand-light">guard</span
            ><span class="brand-period">.</span></span

        >
        <nav aria-label="Main navigation">
          <a href="/" data-page="scan">Repo grader</a

    <main id="main" tabindex="-1"><div id="view"></div></main>
    <footer>
      <a class="footer-brand" href="/">slopguard.</a

        target="_blank"

        >Source on GitHub</a
      ><span class="footer-note">Free to scan. Evidence included.</span>
    </footer>

    <dialog id="modal">
      <div class="dialog-top">
        <span id="modal-label">Slop Guard</span
        ><button id="close-modal" class="icon-button" aria-label="Close dialog">

      </div>
      <div id="modal-body"></div>
