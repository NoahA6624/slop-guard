name: slop-guard
services:
  app:
    build:
      context: .
    image: slop-guard:local
    ports:
      - "127.0.0.1:${SLOP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: true
    environment:
      SLOP_DB: /app/data/slopguard.sqlite3
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
